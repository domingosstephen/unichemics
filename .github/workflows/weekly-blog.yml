name: Weekly Blog Generation

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      count:
        description: "Number of articles to generate"
        required: false
        default: "1"
      dry_run:
        description: "Dry run (no generation)"
        required: false
        type: boolean
        default: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install -g tsx

      - name: Generate blog article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          COUNT="${{ github.event.inputs.count || '1' }}"
          tsx scripts/blog-engine/run.ts --count=$COUNT $ARGS

      - name: Check for new content
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain content/blog/)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new article
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "Blog Engine Bot"
          git config user.email "blog-engine@sociedadeteoflorchemi.com"
          git add content/blog/ scripts/blog-engine/published.json
          ARTICLE_COUNT=$(git status --porcelain content/blog/ | grep "^A\|^?" | wc -l)
          git commit -m "blog: auto-generate ${ARTICLE_COUNT} new article(s)

          Generated by the automated blog engine.
          Run timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Summary
        run: |
          echo "## Blog Generation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            echo "New articles were generated and committed." >> $GITHUB_STEP_SUMMARY
          else
            echo "No new articles were generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Current Stats" >> $GITHUB_STEP_SUMMARY
          tsx scripts/blog-engine/run.ts --stats >> $GITHUB_STEP_SUMMARY 2>&1 || true
